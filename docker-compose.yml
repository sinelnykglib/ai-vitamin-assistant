version: '3.8'

services:
  # Backend API
  backend:
    build: ./backend
    container_name: vitamin-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_logs:/app/logs
    environment:
      - DEBUG=True
      - PYTHONPATH=/app
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/vitamin-assistant
    env_file:
      - .env
    networks:
      - vitamin-network
    depends_on:
      - n8n
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend
  frontend:
    build: ./frontend
    container_name: vitamin-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    networks:
      - vitamin-network
    depends_on:
      - backend

  # n8n Workflow Engine
  n8n:
    build: ./n8n
    container_name: vitamin-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/home/node/.n8n/workflows
    environment:
      - N8N_HOST=n8n
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_USER_FOLDER=/home/node/.n8n
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_METRICS=true
      - N8N_METRICS_INCLUDE_DEFAULT_METRICS=true
    env_file:
      - .env
    networks:
      - vitamin-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: PostgreSQL for production
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: vitamin-postgres
  #   restart: unless-stopped
  #   ports:
  #     - "5432:5432"
  #   environment:
  #     - POSTGRES_USER=vitamin
  #     - POSTGRES_PASSWORD=vitamin123
  #     - POSTGRES_DB=vitamin_assistant
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - vitamin-network

  # Optional: Redis for caching
  # redis:
  #   image: redis:7-alpine
  #   container_name: vitamin-redis
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   networks:
  #     - vitamin-network

networks:
  vitamin-network:
    driver: bridge

volumes:
  backend_logs:
  n8n_data:
  # postgres_data:
  # redis_data: